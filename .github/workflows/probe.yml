name: probe
on:
  push:
    branches: [claude/german-weather-app-replacement-1uq6g7]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DWD WMS layers
        run: |
          curl -sS "https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.3.0&request=GetCapabilities" -o caps.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, re
          ns={'w':'http://www.opengis.net/wms'}
          root=ET.parse('caps.xml').getroot()
          names=[]
          for L in root.iter('{http://www.opengis.net/wms}Layer'):
              n=L.find('w:Name',ns); t=L.find('w:Title',ns)
              if n is None: continue
              names.append(n.text)
              if re.search(r'radar|nieder|rv|nowcast|radolan|wn_|prog|precip', n.text+' '+(t.text or ''), re.I):
                  dims=[(d.get('name'), d.get('default'), (d.text or '')[:150], (d.text or '')[-150:]) for d in L.findall('w:Dimension',ns)]
                  print('###', n.text,'|',t.text,'|',dims)
          print('ALL:', ' '.join(names))
          PY
