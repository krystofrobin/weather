name: probe
on:
  push:
    branches: [claude/german-weather-app-replacement-1uq6g7]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          curl -sS "https://geocoding-api.open-meteo.com/v1/search?name=Buchenb%C3%BChl&count=10&language=en&format=json" > g.json
          python3 - <<'PY'
          import json, urllib.request
          for r in json.load(open('g.json')).get('results', []):
              u = f"https://api.open-meteo.com/v1/forecast?latitude={r['latitude']}&longitude={r['longitude']}&models=icon_seamless&current=temperature_2m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto"
              c = json.load(urllib.request.urlopen(u))
              print(r['name'], r.get('admin1'), r.get('admin2'), r.get('admin3'), r['latitude'], r['longitude'], '->', c['current'], c['daily']['temperature_2m_max'], c['daily']['temperature_2m_min'])
          PY
          echo "== reverse geocode Nuremberg-Buchenbuehl"
          curl -sS "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=49.505&longitude=11.13&localityLanguage=en" | head -c 400; echo
