name: probe
on:
  push:
    branches: [claude/german-weather-app-replacement-1uq6g7]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          B="https://maps.dwd.de/geoserver/dwd"
          echo "== layer caps"; curl -sS -D - -H "Origin: https://krystofrobin.github.io" "$B/Niederschlagsradar/wms?service=WMS&version=1.3.0&request=GetCapabilities" -o lc.xml | grep -i "access-control\|content-type\|HTTP/"; ls -la lc.xml
          grep -o '<EX_GeographicBoundingBox>.*</EX_GeographicBoundingBox>' lc.xml | head -c 400; echo
          grep -o '<Dimension[^>]*>' lc.xml | head; grep -o '<Style>.\{0,300\}' lc.xml | head -3
          python3 -c "import re;x=open('lc.xml').read();print([ (m[:80], m[-80:]) for m in re.findall(r'<Dimension[^>]*>([^<]*)',x)])"
          F=$(date -u -d "+90 min" +%Y-%m-%dT%H:%M:00Z | sed 's/:[0-9]\(:00Z\)/:00\1/'); M=$(date -u -d "+90 min" +%M); F=$(date -u -d "+90 min" +%Y-%m-%dT%H:)$(printf %02d $((10#$M/5*5))):00Z
          for T in "$F" "$(date -u -d '+3 hours' +%Y-%m-%dT%H:00:00Z)"; do
            echo "== GetMap $T"; curl -sS -D - -H "Origin: https://krystofrobin.github.io" "$B/wms?service=WMS&request=GetMap&version=1.3.0&layers=dwd:Niederschlagsradar&styles=&format=image/png&transparent=true&crs=EPSG:4326&bbox=47,5,55,16&width=256&height=256&time=$T" -o m.png | grep -i "access-control\|content-type\|HTTP/"; file m.png; head -c 300 m.png | strings | head -3
          done
          echo "== WN product"; curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" "$B/wms?service=WMS&request=GetMap&version=1.3.0&layers=dwd:Radar_wn-product_1x1km_ger&styles=&format=image/png&transparent=true&crs=EPSG:4326&bbox=47,5,55,16&width=256&height=256&time=$F"
